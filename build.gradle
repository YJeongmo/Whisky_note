plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.whisky'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.projectlombok:lombok:1.18.26'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.ai:spring-ai-ollama-spring-boot-starter'

	testImplementation 'com.h2database:h2' // 테스트 전용
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// AOP — 전역 로깅, 횡단 관심사 처리
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// Bean Validation — @Valid 입력값 검증
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Phase 1: Spring Security + JWT
	// spring-boot-starter-security: 인증/인가 프레임워크
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// jjwt: JWT 토큰 생성/검증 라이브러리
	// api: 코드에서 직접 사용하는 인터페이스
	// impl, jackson: 런타임에만 필요한 구현체 (runtimeOnly)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Spring Security 테스트 지원 (@WithMockUser 등)
	testImplementation 'org.springframework.security:spring-security-test'

	// Swagger / OpenAPI — API 문서 자동화
	// springdoc-openapi: Spring Boot 3.x용 Swagger UI 통합 라이브러리
	// /swagger-ui/index.html 에서 브라우저로 API 문서 확인 및 직접 호출 가능
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:1.0.0-M5" // 👈 최신 버전 명시
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
