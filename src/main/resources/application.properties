spring.application.name=whisky-note

# 민감 정보는 application-secret.properties에서 관리 (GitHub 비공개)
spring.config.import=optional:classpath:application-secret.properties

# DB ?? ??
spring.datasource.url=jdbc:postgresql://localhost:5432/whisky_db
spring.datasource.username=PC
spring.datasource.password=

# JPA ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ════════════════════════════════════════════════
# AI 모델 선택 — 아래 두 블록 중 하나만 주석 해제
# ════════════════════════════════════════════════

# [1] Ollama — 로컬 개발용 (현재 활성)
#spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.model=llama3
#spring.ai.ollama.chat.options.format=json
#spring.ai.ollama.chat.options.num-predict=500

# [2] OpenAI — 배포용 (사용 시 위 [1] 블록 주석 처리 후 아래 주석 해제)
 spring.ai.openai.api-key=YOUR_OPENAI_API_KEY
 spring.ai.openai.chat.options.model=gpt-4o-mini
# ════════════════════════════════════════════════

# JWT
# secret: application-secret.properties에서 관리 (GitHub 비공개)
# expiration: 밀리초 단위 (86400000 = 24시간)
jwt.expiration=86400000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Swagger / OpenAPI
# swagger-ui/index.html 에서 API 문서 확인 가능
springdoc.swagger-ui.path=/swagger-ui.html
# 운영 환경에서는 false로 변경 (외부 노출 방지)
springdoc.api-docs.enabled=true