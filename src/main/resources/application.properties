spring.application.name=whisky-note

# DB ?? ??
spring.datasource.url=jdbc:postgresql://localhost:5432/whisky_db
spring.datasource.username=PC
spring.datasource.password=

# JPA ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3
spring.ai.ollama.chat.options.format=json
spring.ai.ollama.chat.options.num-predict=500

# JWT
# secret: HS256 알고리즘 기준 256bit(32바이트) 이상이어야 합니다. 절대 GitHub에 노출 금지.
jwt.secret=whisky-note-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
# expiration: 밀리초 단위 (86400000 = 24시간)
jwt.expiration=86400000