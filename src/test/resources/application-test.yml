spring:
  datasource:
    # H2 인메모리 DB: 테스트 실행 시에만 존재하고 종료되면 사라집니다
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # create-drop: 테스트 시작 시 테이블 생성, 종료 시 삭제 → 항상 깨끗한 환경 보장
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 콘솔 (테스트 중 디버깅용, 필요 시 http://localhost:8080/h2-console 접근)
  h2:
    console:
      enabled: true

# JWT (테스트 전용 설정)
jwt:
  secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000
